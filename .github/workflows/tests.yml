name: Testa bokprojektet

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut koden från repot
        uses: actions/checkout@v4

      - name: Inställningar för Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r Requirements.txt
          pip install flake8

      - name: Linta koden med Flake8
        run: python -m flake8 src tests

      - name: Kör testerna med pytest
        run: python -m pytest --maxfail=1 --disable-warnings -q

      - name: Installera Chromium för Playwright
        run: python -m playwright install --with-deps chromium

      - name: Kör testerna med Behave
        run: python -m behave src/features